<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SHOP DZ</title>
<style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1b1f24;--m:#6b7280;--p:#0f766e;--b:#e5e7eb;--r:#dc2626;--g:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--c:#1b2026;--t:#eceff3;--m:#9aa3ae;--b:#2d343c;--p:#2dd4bf}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:var(--c);border-bottom:1px solid var(--b);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:18px;margin:0;flex:1;color:var(--p)}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--t);border:1px solid var(--b)}button.d{background:var(--r)}button.w{background:#25d366}
button.on{background:var(--p);color:#fff}
main{max-width:1000px;margin:0 auto;padding:14px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}
.pc img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fff}
.pc{position:relative}.pc h3{font-size:15px;margin:8px 0 2px}.pr{color:var(--p);font-weight:700}
.badge{position:absolute;top:18px;inset-inline-start:18px;background:var(--r);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tabs button{white-space:nowrap}
.stat{font-size:22px;font-weight:700}.sm{font-size:13px;color:var(--m)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:start;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--b)}
.bc{background:#fff;padding:6px;display:inline-block;border-radius:6px;color:#000;text-align:center;font-size:11px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal>div{background:var(--c);border-radius:12px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;inset:0;background:#fff;color:#000}.np{display:none!important}}
.hero{background:linear-gradient(135deg,#1a1a1a,#3a2c12);color:#f1d98b;font:600 18px Georgia,serif;letter-spacing:.08em;text-align:center;padding:22px 12px;border-radius:14px;margin-bottom:12px}
.pc{cursor:pointer;transition:transform .2s,box-shadow .2s;padding:10px}.pc:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}

.pc button,.gb{font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}
.dt{display:grid;gap:12px}.dt img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--b)}.gold{font-weight:700;font-size:22px;color:var(--p)}
</style></head><body>
<header><h1 id="ttl"></h1><button class="s" onclick="mode=mode=='acct'?'shop':'acct';draw()" id="ab"></button><button class="s" onclick="tog()" id="mb"></button><button class="s" onclick="setL()">FR / عربي</button></header>
<main id="app"></main><div id="mo"></div>
<script id="cat" type="application/json">{}</script>
<script id="main">
const I={shop:['المتجر','Boutique'],admin:['الإدارة','Admin'],cart:['السلة','Panier'],add:['أضف للسلة','Ajouter'],out:['انتهى المنتج','Épuisé'],name:['الاسم الكامل','Nom complet'],wil:['الولاية','Wilaya'],ph:['رقم الهاتف','Téléphone'],order:['تأكيد الطلب','Confirmer la commande'],prods:['المنتجات','Produits'],orders:['الطلبات','Commandes'],custs:['العملاء','Clients'],exp:['استهلاك شخصي','Dépenses perso'],dash:['الإحصائيات','Statistiques'],cats:['الفئات','Catégories'],set:['الإعدادات','Réglages'],buy:['سعر الشراء','Prix d’achat'],sell:['سعر البيع','Prix de vente'],stock:['المخزون','Stock'],cat:['الفئة','Catégorie'],bc:['الباركود','Code-barres'],desc:['معلومات المنتج','Infos produit'],save:['حفظ','Enregistrer'],del:['حذف','Supprimer'],all:['الكل','Tous'],pending:['قيد التجهيز','En préparation'],ship:['قيد التوصيل','En livraison'],canc:['ملغى','Annulée'],done:['تم الاستلام','Reçue'],inv:['فاتورة','Facture'],print:['طباعة','Imprimer'],wa:['واتساب العميل','WhatsApp client'],cs:['خدمة العملاء عبر واتساب','Service client WhatsApp'],spent:['ما أنفقته (شراء)','Dépensé (achats)'],earn:['المبيعات','Ventes'],profit:['الربح','Bénéfice'],net:['الصافي بعد الاستهلاك الشخصي','Net après dépenses perso'],bought:['كمية مشتراة','Qté achetée'],sold:['كمية مباعة','Qté vendue'],photo:['صورة المنتج (تُحسَّن تلقائيا)','Photo (retouchée auto)'],search:['بحث أو مسح الباركود','Recherche / code-barres'],empty:['السلة فارغة','Panier vide'],tot:['المجموع','Total'],ok:['تم تسجيل طلبك، شكرا!','Commande enregistrée, merci !'],lbl:['البيان','Libellé'],amt:['المبلغ','Montant'],n:['عدد الطلبات','Nb commandes'],spnt:['اشترى بمبلغ','A acheté pour'],gain:['ربحنا منه','Notre gain'],sn:['اسم المتجر','Nom boutique'],swa:['رقم واتساب المتجر (مع رمز البلد)','WhatsApp boutique (avec indicatif)'],pin:['رمز الإدارة','Code admin'],pw:['رمز الإدارة؟','Code admin ?'],rs:['إضافة مخزون','Réappro.'],qty:['الكمية','Quantité'],new:['جديد','Nouveau'],date:['التاريخ','Date'],edit:['تعديل','Modifier'],bak:['أنت تبيع على جهاز واحد: البيانات محفوظة في هذا المتصفح.','Données enregistrées dans ce navigateur.']};
const WIL=['Adrar','Chlef','Laghouat','Oum El Bouaghi','Batna','Béjaïa','Biskra','Béchar','Blida','Bouira','Tamanrasset','Tébessa','Tlemcen','Tiaret','Tizi Ouzou','Alger','Djelfa','Jijel','Sétif','Saïda','Skikda','Sidi Bel Abbès','Annaba','Guelma','Constantine','Médéa','Mostaganem','M’Sila','Mascara','Ouargla','Oran','El Bayadh','Illizi','Bordj Bou Arréridj','Boumerdès','El Tarf','Tindouf','Tissemsilt','El Oued','Khenchela','Souk Ahras','Tipaza','Mila','Aïn Defla','Naâma','Aïn Témouchent','Ghardaïa','Relizane'];
let L='ar',mode='shop',tab='dash',cat=0,q='',cart=[],img='',edit=null,adm=false;
let D={cats:[],prods:[],orders:[],exp:[],users:[],me:0,set:{name:'SHOP DZ',wa:'',pin:'1234'}};
try{const s=localStorage.getItem('shop1');if(s)D=JSON.parse(s)}catch(x){}
if(D.set.name==='متجري')D.set.name='SHOP DZ';if(!D.users)D.users=[];adm=!!D.adm;try{const S=JSON.parse(document.getElementById('cat').textContent||'{}');if(S.ver&&!adm&&(D.snapVer||0)<S.ver){D.cats=S.cats;D.prods=S.prods;D.set={...D.set,...S.set};D.snapVer=S.ver}}catch(x){}
const sv=()=>{try{localStorage.setItem('shop1',JSON.stringify(D))}catch(x){alert('⚠ Stockage plein / التخزين ممتلئ')}};
const t=k=>I[k][L=='ar'?0:1],E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>Number(n||0).toLocaleString('fr-DZ')+' DA',$=i=>document.getElementById(i),V=i=>$(i).value;
const ST=['pending','ship','done','canc'];
const live=()=>D.orders.filter(o=>o.st!='canc');
function itf(c){c=String(c);if(c.length%2)c='0'+c;const P=['00110','10001','01001','11000','00101','10100','01100','00011','10010','01010'];let b=[[1,1],[1,1],[1,1],[1,1]].map(a=>1);let bars=[1,1,1,1];let x=2,w=6;for(let i=0;i<c.length;i+=2){const a=P[c[i]],s=P[c[i+1]];for(let j=0;j<5;j++){bars.push(a[j]=='1'?3:1,s[j]=='1'?3:1)}}bars.push(3,1,1);let o='',p=8;bars.forEach((u,i)=>{if(i%2==0)o+=`<rect x="${p}" width="${u*1.6}" height="40" fill="#000"/>`;p+=u*1.6});return `<svg width="${p+8}" height="40" viewBox="0 0 ${p+8} 40">${o}</svg>`}
function setL(){L=L=='ar'?'fr':'ar';document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';draw()}
function tog(){if(mode=='admin'){mode='shop';draw();return}if(adm){mode='admin';draw();return}ask(t('pw'),p=>{if(p!==D.set.pin)return alert('✕ '+t('pin'));adm=true;D.adm=1;sv();mode='admin';draw()},'password')}
function draw(){$('ttl').textContent=D.set.name;$('mb').textContent=mode=='admin'?t('shop'):t('admin');$('ab').textContent=me()?'👤 '+me().name.split(' ')[0]:'👤 '+t('login');$('app').innerHTML=mode=='admin'?admin():mode=='acct'?acct():shop()}
function pcard(p){return `<div class="card pc" onclick="det(${p.id})">${p.stock<=0?`<span class="badge">${t('out')}</span>`:''}<img src="${p.img||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E'}" alt=""><h3>${E(p.name)}</h3><div class="pr">${F(p.sell)}</div><div class="sm">${E(p.desc)}</div><button style="width:100%;margin-top:8px" ${p.stock<=0?'disabled':''} onclick="event.stopPropagation();addC(${p.id})">${t('add')}</button></div>`}
function shop(){const cn=D.cats;let l=D.prods.filter(p=>(!cat||p.cat==cat)&&(!q||(p.name+p.barcode).toLowerCase().includes(q.toLowerCase())));
return `<div class="row"><input id="sq" placeholder="${t('search')}" value="${E(q)}" oninput="q=this.value;gl()"><button class="s" style="flex:0" onclick="scan(c=>{q=c;draw()})">📷</button><button onclick="cartM()">🛒 ${t('cart')} (${cart.reduce((a,c)=>a+c.q,0)})</button>${D.set.wa?`<button class="w" onclick="open('https://wa.me/${D.set.wa}','_blank')">${t('cs')}</button>`:''}</div><div class="chips"><button class="${!cat?'on':'s'}" onclick="cat=0;draw()">${t('all')}</button>${cn.map(c=>`<button class="${cat==c.id?'on':'s'}" onclick="cat=${c.id};draw()">${E(c.name)}</button>`).join('')}</div><div class="grid" id="gl">${l.map(pcard).join('')}</div>`}
function gl(){const l=D.prods.filter(p=>(!cat||p.cat==cat)&&(!q||(p.name+p.barcode).toLowerCase().includes(q.toLowerCase())));$('gl').innerHTML=l.map(pcard).join('')}
function addC(id){const p=D.prods.find(x=>x.id==id),c=cart.find(x=>x.id==id);if(c){if(c.q<p.stock)c.q++}else cart.push({id,q:1});draw()}
function cartM(){const tot=cart.reduce((a,c)=>a+c.q*D.prods.find(p=>p.id==c.id).sell,0);
$('mo').innerHTML=`<div class="modal"><div><h3>${t('cart')}</h3>${cart.length?cart.map(c=>{const p=D.prods.find(x=>x.id==c.id);return `<div class="row"><span>${E(p.name)}</span><span>${F(p.sell)} × ${c.q}</span><button class="s" onclick="cq(${c.id},-1)">−</button><button class="s" onclick="cq(${c.id},1)">+</button></div>`}).join('')+`<p><b>${t('tot')}: ${F(tot)}</b></p><label>${t('name')}</label><input id="cn" value="${E(me()?.name)}"><label>${t('wil')}</label><select id="cw">${WIL.map((w,i)=>`<option ${me()&&me().wil==(i+1)+' - '+w?'selected':''}>${i+1} - ${w}</option>`).join('')}</select><label>${t('ph')}</label><input id="cp" type="tel" value="${E(me()?.ph)}"><p><button onclick="place()">${t('order')}</button></p>`:`<p>${t('empty')}</p>`}<button class="s" onclick="cl()">✕</button></div></div>`}
function cl(){$('mo').innerHTML='';draw()}
function cq(id,d){const c=cart.find(x=>x.id==id),p=D.prods.find(x=>x.id==id);c.q=Math.min(p.stock,c.q+d);if(c.q<=0)cart=cart.filter(x=>x.id!=id);cartM()}
function place(){const n=V('cn').trim(),p=V('cp').trim();if(!n||!p||!cart.length)return alert(t('name')+' / '+t('ph'));
const it=cart.map(c=>{const x=D.prods.find(y=>y.id==c.id);x.stock-=c.q;return{id:x.id,name:x.name,q:c.q,buy:x.buy,sell:x.sell}});
const o={id:Date.now(),date:new Date().toISOString().slice(0,10),name:n,wil:V('cw'),ph:p,it,st:'pending'};D.orders.push(o);sv();cart=[];
$('mo').innerHTML=`<div class="modal"><div id="inv"><h2>${E(D.set.name)}</h2><h3>✅ ${t('ok')}</h3><p>${t('inv')} #${String(o.id).slice(-6)} · ${o.date}<br>${E(o.name)} · ${E(o.wil)} · ${E(o.ph)}</p><table>${o.it.map(i=>`<tr><td>${E(i.name)}</td><td>${i.q} × ${F(i.sell)}</td><td>${F(i.q*i.sell)}</td></tr>`).join('')}</table><h3>${t('tot')}: ${F(tot(o))}</h3><p class="np">${D.set.wa?`<button class="w" onclick="open('https://wa.me/${D.set.wa}?text='+encodeURIComponent(msg(${o.id})),'_blank')">${t('sendw')}</button> `:''}<button onclick="print()">${t('print')}</button> <button class="s" onclick="cl()">OK</button></p></div></div>`}
const tot=o=>o.it.reduce((a,i)=>a+i.q*i.sell,0),cost=o=>o.it.reduce((a,i)=>a+i.q*i.buy,0);
function msg(id){const o=D.orders.find(x=>x.id==id);return `${D.set.name}\n${t('inv')} #${String(o.id).slice(-6)}\n`+o.it.map(i=>`• ${i.name} × ${i.q} = ${F(i.q*i.sell)}`).join('\n')+`\n${t('tot')}: ${F(tot(o))}\n${o.name} - ${o.wil} - ${o.ph}`}
function admin(){const T=['dash','prods','cats','orders','custs','exp','set'];return `<div class="tabs">${T.map(k=>`<button class="${tab==k?'on':'s'}" onclick="tab='${k}';edit=null;img='';draw()">${t(k)}</button>`).join('')}<button class="d" onclick="adm=false;D.adm=0;sv();mode='shop';draw()">${t('lo')}</button></div>`+({dash,prods,cats,orders,custs,exp,set})[tab]()}
function dash(){const sp=D.prods.reduce((a,p)=>a+p.buy*p.bought,0),ea=live().reduce((a,o)=>a+tot(o),0),pr=ea-live().reduce((a,o)=>a+cost(o),0),ex=D.exp.reduce((a,e)=>a+e.amt,0),sd=live().reduce((a,o)=>a+o.it.reduce((b,i)=>b+i.q,0),0),bt=D.prods.reduce((a,p)=>a+p.bought,0);
const c=(l,v)=>`<div class="card"><div class="sm">${l}</div><div class="stat">${v}</div></div>`;
return `<div class="st">${c(t('spent'),F(sp))}${c(t('earn'),F(ea))}${c(t('profit'),F(pr))}${c(t('exp'),F(ex))}${c(t('net'),F(pr-ex))}${c(t('bought'),bt)}${c(t('sold'),sd)}</div><p class="sm">${t('bak')}</p><p><button onclick="pub()">${t('pubb')}</button></p><p class="sm">${t('pubn')}</p>`}
function prods(){const p=edit?D.prods.find(x=>x.id==edit):{};const e=edit!==null;
return `<div class="card"><b>${e?t('edit'):t('new')}</b><div class="row"><div><label>${t('name')}</label><input id="pn" value="${E(p.name)}"></div><div><label>${t('cat')}</label><select id="pc"><option value="0">-</option>${D.cats.map(c=>`<option value="${c.id}" ${p.cat==c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select></div></div><div class="row"><div><label>${t('buy')}</label><input id="pb" type="number" value="${p.buy??''}"></div><div><label>${t('sell')}</label><input id="ps" type="number" value="${p.sell??''}"></div><div><label>${t('stock')}</label><input id="pk" type="number" value="${p.stock??''}" ${e?'disabled':''}></div></div><label>${t('bc')}</label><div class="row"><input id="pcode" value="${E(p.barcode)}" placeholder="123456789012"><button class="s" style="flex:0" onclick="scan(c=>$('pcode').value=c)">📷</button></div><label>${t('desc')}</label><textarea id="pd" rows="2">${E(p.desc)}</textarea><label>${t('photo')}</label><div class="row"><label class="btn" style="margin:0;color:#fff;font-size:15px;text-align:center">${t('cam')}<input type="file" accept="image/*" capture="environment" hidden onchange="pick(this)"></label><label class="btn" style="margin:0;color:#fff;font-size:15px;text-align:center">${t('gal')}<input type="file" accept="image/*" hidden onchange="pick(this)"></label></div><div style="display:none"><label>${t('bgt')}</label><select id="bgs" onchange="bgK=this.value;mk()"><option value="clear" selected>${t('b7')}</option><option value="pro">${t('b8')}</option><option value="none">${t('b0')}</option><option value="white">${t('b1')}</option><option value="sun">${t('b2')}</option><option value="sea">${t('b3')}</option><option value="dark">${t('b4')}</option><option value="mint">${t('b5')}</option><option value="mine">${t('b6')}</option></select><input type="file" accept="image/*" onchange="pickBg(this)" style="margin-top:6px"><div class="sm">${t('bnote')}</div></div><img id="pv" style="display:none;width:160px;border-radius:8px;margin-top:8px;background:#fff;border:1px solid var(--b)"><p><button onclick="saveP()">${t('save')}</button> ${e?`<button class="s" onclick="edit=null;img='';draw()">✕</button>`:''}</p></div><br><div class="tbl"><table>${D.prods.map(p=>`<tr><td><img src="${p.img}" width="40" height="40" style="border-radius:6px;object-fit:cover"></td><td>${E(p.name)}<div class="sm">${F(p.buy)} → ${F(p.sell)}</div></td><td>${p.stock<=0?`<span class="pill" style="background:var(--r);color:#fff">${t('out')}</span>`:p.stock}</td><td><div class="bc">${itf(p.barcode)}<br>${p.barcode}</div></td><td><button class="s" onclick="edit=${p.id};draw()">✎</button> <button class="s" onclick="rs(${p.id})">＋</button> <button class="d" onclick="dp(${p.id})">✕</button></td></tr>`).join('')}</table></div>`}
function pick(f){const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const s=Math.min(1,600/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*s;c.height=m.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.filter='brightness(1.08) contrast(1.12) saturate(1.15)';x.drawImage(m,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.82)};m.src=r.result};r.readAsDataURL(f.files[0])}
function saveP(){const n=V('pn').trim();if(!n)return;let code=V('pcode').replace(/\D/g,'');if(!code)code=String(Date.now()).slice(-12);
const d={name:n,cat:+V('pc'),buy:+V('pb')||0,sell:+V('ps')||0,barcode:code,desc:V('pd')};
if(edit){const p=D.prods.find(x=>x.id==edit);Object.assign(p,d);if(img)p.img=img}else{const k=+V('pk')||0;D.prods.push({id:Date.now(),...d,stock:k,bought:k,img})}
sv();edit=null;img='';srcI=null;bgI=null;bgK='raw';TL=1;draw()}
function rs(id){ask(t('qty'),v=>{const n=+v;if(n>0){const p=D.prods.find(x=>x.id==id);p.stock+=n;p.bought+=n;sv();draw()}},'number')}
function dp(id){$('mo').innerHTML='<div class="modal"><div><p>'+t('del')+' ?</p><button class="d" onclick="D.prods=D.prods.filter(p=>p.id!='+id+');sv();cl()">'+t('del')+'</button> <button class="s" onclick="cl()">✕</button></div></div>'}
