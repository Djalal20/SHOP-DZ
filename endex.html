<script>

let L=localStorage.getItem&&(()=>{try{return localStorage.getItem("l")}catch(e){return null}})()||"ar",db=null,adm=false,B=[],C=[],PH=null,uid="",unl=false,pd="",P=[],O=[],S={},cart={},view="shop",tab="dash",cat="",edit=null;

const dl=$("#dl");
function setL(){document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";$("#lg").textContent=L=="ar"?"FR":"عربي";$("#ad").textContent=view=="admin"?t("shop"):t("admin");$("#ct").textContent=t("cart")+" ("+Object.values(cart).reduce((a,b)=>a+b,0)+")"}
function R(){setL();$("#app").innerHTML=view=="admin"?adminV():shopV()}
function shopV(){const cs=[...new Set(P.map(p=>p.cat).filter(Boolean))];
let h=cs.length?`<div class="tabs"><button class="b ${!cat?"":"s"}" data-c="">${t("all")}</button>${cs.map(c=>`<button class="b ${cat==c?"":"s"}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:"";

function adminV(){if(!adm)return`<div class="pan">${t("noacc")}</div>`;if(!unl)return`<div class="pan"><b>${PH?t("pw"):t("setpw")}</b><input id="pw" type="password" autocomplete="off"><button class="b" id="pl" style="margin-top:8px">${PH?t("login"):t("save")}</button><p class="m" id="pe"></p></div>`;

if(tab=="dash")return tb+dashV();if(tab=="custs")return tb+custV();if(tab=="buy")return tb+buyV();if(tab=="cons")return tb+consV();if(tab=="set")return tb+`<div class="pan"><label>${t("wa")}</label><input id="wa" value="${esc(S.wa||"")}" inputmode="tel"><button class="b" id="sw" style="margin-top:8px">${t("save")}</button></div><div class="pan"><b>${t("chpw")}</b><input id="op" type="password" placeholder="${t("oldpw")}"><input id="np" type="password" placeholder="${t("newpw")}"><button class="b" id="cp2" style="margin-top:8px">${t("save")}</button><p class="m" id="pm"></p></div>`;
if(tab=="orders"){const pf=O.filter(o=>o.status=="ok").reduce((a,o)=>a+(o.profit||0),0);
return tb+`<div class="pan m">${t("cnt")}: ${O.length} · ${t("profit")}: ${pf} ${t("da")}</div><div class="pan ov"><table>${O.map(o=>`<tr><td><b>${esc(o.name)}</b><br><span class="m">${esc(o.phone)} · ${esc(o.wilaya)}<br>${esc(o.addr)}</span></td><td>${(o.items||[]).map(i=>esc(i.n)+" ×"+i.q).join("<br>")}<br><b>${o.total} ${t("da")}</b></td><td><select data-o="${o.id}">${Object.keys(t("st")).map(k=>`<option value="${k}" ${o.status==k?"selected":""}>${t("st")[k]}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td class="m">—</td></tr>`}</table></div>`}
return tb+`<button class="b" data-e="new">+ ${t("pn")}</button><div class="pan ov"><table>${P.map(p=>`<tr><td>${p.img?`<img src="${esc(p.img)}" width="40" height="40" style="border-radius:8px;object-fit:cover">`:""}</td><td><b>${esc(p.name)}</b><br><span class="m">${+p.price} ${t("da")} · ${t("ps")}: ${+p.stock}</span></td><td><button class="b s" data-e="${p.id}">${t("edit")}</button> <button class="b r" data-d="${p.id}">${pd==p.id?t("sure"):t("del")}</button></td></tr>`).join("")}</table></div>`}
const H=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("shopdz"+s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function consV(){const k=ts=>new Date(ts).toLocaleDateString(),n=new Date(),td=k(n),sum=a=>a.reduce((s,x)=>s+x.amt,0),day=sum(C.filter(x=>k(x.ts)==td)),mo=sum(C.filter(x=>{const d=new Date(x.ts);return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()})),g={};C.slice().sort((a,b)=>b.ts-a.ts).forEach(x=>(g[k(x.ts)]=g[k(x.ts)]||[]).push(x));const c=(l,v)=>`<div class="pan"><div class="m">${l}</div><b class="p" style="font-size:22px">${v} ${t("da")}</b></div>`;return`<div class="grid">${c(t("ctoday"),day)}${c(t("cmonth"),mo)}</div><div class="pan"><div class="row"><input id="cl" placeholder="${t("cl")}"><input id="cm" type="number" placeholder="${t("ca2")}"></div><button class="b" id="ac" style="margin-top:8px">+ ${t("save")}</button></div>${Object.keys(g).map(d=>`<div class="pan ov"><b>${d}</b> <span class="m">${sum(g[d])} ${t("da")}</span><table>${g[d].map(x=>`<tr><td>${esc(x.label)}</td><td>${x.amt}</td><td><button class="b r" data-dc="${x.id}">${pd==x.id?t("sure"):t("del")}</button></td></tr>`).join("")}</table></div>`).join("")}`}
function dashV(){const ok=O.filter(o=>o.status=="ok"),sold=ok.reduce((a,o)=>a+o.total,0),pf=ok.reduce((a,o)=>a+(o.profit||0),0),bt=P.reduce((a,p)=>a+(+p.cost||0)*(+p.stock||0),0);const c=(l,v)=>`<div class="pan"><div class="m">${l}</div><b class="p" style="font-size:22px">${Math.round(v)} ${t("da")}</b></div>`;return`<div class="grid">${c(t("bought"),bt)}${c(t("sold"),sold)}${c(t("profit"),pf)}${c(t("net"),sold-bt)}${c(t("cons"),C.reduce((a,x)=>a+x.amt,0))}</div><button class="b s" id="lk">${t("lock")}</button>`}
function custV(){const m={};O.filter(o=>o.status!="no").forEach(o=>{const c=m[o.phone]=m[o.phone]||{n:o.name,w:o.wilaya,p:o.phone,c:0,t:0,pf:0,it:{}};c.c++;(o.items||[]).forEach(i=>{const k=i.id||i.n,e=c.it[k]=c.it[k]||{n:i.n,id:i.id,q:0};e.q+=i.q});c.t+=o.total;c.pf+=o.profit||0});const l=Object.values(m).sort((a,b)=>b.t-a.t);return`<div class="pan ov"><table><tr><th>${t("name")}</th><th>${t("cnt")}</th><th>${t("spent")}</th><th>${t("profit")}</th></tr>${l.map(c=>`<tr><td><b>${esc(c.n)}</b><br><span class="m">${esc(c.p)} · ${esc(c.w)}</span><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${Object.values(c.it).map(e=>{const p=P.find(x=>x.id==e.id);return`<span style="display:flex;align-items:center;gap:4px;font-size:12px">${p&&p.img?`<img src="${esc(p.img)}" width="36" height="36" style="border-radius:6px;object-fit:cover">`:""}${esc(e.n)} ×${e.q}</span>`}).join("")}</div></td><td>${c.c}</td><td>${c.t}</td><td>${Math.round(c.pf)}</td></tr>`).join("")||"<tr><td>—</td></tr>"}</table></div>`}
function buyV(){const g={};B.slice().sort((a,b)=>a.ts-b.ts).forEach(b=>{const k=b.item.trim().toLowerCase();(g[k]=g[k]||{n:b.item,s:{}}).s[b.supp.trim().toLowerCase()]={sp:b.supp,u:b.unit}});const cmp=Object.values(g).map(x=>{const a=Object.values(x.s).sort((p,q)=>p.u-q.u);return`<tr><td><b>${esc(x.n)}</b></td><td>${a.map((s,i)=>`<div class="${i?"":"p"}">${esc(s.sp)}: ${s.u} ${t("da")}${i==0&&a.length>1?" ✓":""}</div>`).join("")}</td></tr>`}).join("");const h=B.slice().sort((a,b)=>b.ts-a.ts).map(b=>`<tr><td><b>${esc(b.item)}</b><br><span class="m">${esc(b.supp)} · ${new Date(b.ts).toLocaleDateString()}</span></td><td>${b.qty} × ${b.unit}</td><td><button class="b r" data-dp="${b.id}">${t("del")}</button></td></tr>`).join("");return`<button class="b" id="nb">+ ${t("buy")}</button><div class="pan ov"><b>${t("cmp")}</b><table>${cmp}</table></div><div class="pan ov"><table>${h}</table></div>`}
function prodForm(id){const p=P.find(x=>x.id==id)||{};edit={id:p.id,img:p.img||""};
dl.innerHTML=`<h3>${t("pn")}</h3><input id="fn" placeholder="${t("pn")}" value="${esc(p.name)}"><div class="row"><input id="fp" type="number" placeholder="${t("pp")}" value="${p.price??""}"><input id="fc" type="number" placeholder="${t("pc")}" value="${p.cost??""}"></div><div class="row"><input id="fs" type="number" placeholder="${t("ps")}" value="${p.stock??""}"><input id="fk" placeholder="${t("pcat")}" value="${esc(p.cat)}"></div><label class="m">${t("img")}</label><input id="fi" type="file" accept="image/*"><div class="row" style="margin-top:8px"><button class="b" id="fv">${t("save")}</button><button class="b s" id="fx">${t("close")}</button></div>`;dl.showModal()}
function shrink(f){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.72))};i.src=u})}
function cartV(){const ids=Object.keys(cart).filter(i=>P.find(p=>p.id==i));let tot=0;
if(!ids.length){dl.innerHTML=`<p>${t("cartEmpty")}</p><button class="b s" id="fx">${t("close")}</button>`;return dl.showModal()}
dl.innerHTML=`<h3>${t("cart")}</h3>${ids.map(i=>{const p=P.find(x=>x.id==i);tot+=p.price*cart[i];return`<div class="row" style="margin:4px 0"><span>${esc(p.name)}</span><span>${cart[i]} × ${+p.price}</span><button class="b s" data-r="${i}" style="flex:0">−</button></div>`}).join("")}<p><b>${t("tot")}: ${tot} ${t("da")}</b></p><input id="cn" placeholder="${t("name")}"><input id="cp" placeholder="${t("ph")}" inputmode="tel"><input id="cw" placeholder="${t("wil")}"><input id="ca" placeholder="${t("addr")}"><div class="row"><button class="b" id="co">${t("send")}</button><button class="b s" id="fx">${t("close")}</button></div>`;dl.showModal()}
async function checkout(){const g=i=>$(i).value.trim(),name=g("#cn"),phone=g("#cp");if(!name||!phone)return;

try{await db.collection("orders").add(o)}catch(e){}

document.addEventListener("click",async e=>{const x=e.target.closest("button");if(!x)return;const d=x.dataset;

const c=db.collection("products"),op=P.find(x=>x.id==edit.id),add=Math.max(0,o.stock-(op?+op.stock:0))*o.cost;edit.id?await c.doc(edit.id).set(o):await c.add(o);dl.close()}});
